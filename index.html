<body class="bg-gray-100">

    <!-- Install Help Popup -->
    <div id="install-overlay" class="hidden fixed inset-0 bg-black/40 z-50">
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl p-5 shadow-lg">
        <div class="flex items-start justify-between gap-3">
        <div>
            <div class="text-sm text-gray-500">주평강교회웹앱</div>
            <div class="text-lg font-bold mt-1">홈화면에 설치하면 더 편해요</div>
            <div class="text-sm text-gray-500 mt-2" id="install-desc"></div>
        </div>
        <button id="install-close" class="text-gray-400 text-xl leading-none">×</button>
        </div>

        <div class="mt-4 flex gap-2">
        <button id="install-btn" class="hidden flex-1 py-3 rounded-xl bg-blue-600 text-white font-semibold active:scale-[0.99]">
            설치하기
        </button>
        <button id="install-ok" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-800 font-semibold active:scale-[0.99]">
            괜찮아요
        </button>
        </div>
    </div>
    </div>


    <script>
    // SW
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js");
    }

    // ----- Install Prompt Helper -----
    const overlay = document.getElementById("install-overlay");
    const installBtn = document.getElementById("install-btn");
    const installOk = document.getElementById("install-ok");
    const installClose = document.getElementById("install-close");
    const installDesc = document.getElementById("install-desc");

    let deferredPrompt = null;

    // 이미 설치되어 실행 중인지(standalone) 체크
    function isStandalone() {
        return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    }

    // iOS Safari 여부 대략 판별
    function isIOS() {
        return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }

    // 설치 안내를 한번만 보여주고 싶으면 로컬 저장
    const SEEN_KEY = "installHelpSeen:v1";

    function openInstallHelp() {
        if (isStandalone()) return; // 이미 설치된 상태면 안내 안함

        // 한번만 띄우고 싶으면 아래 2줄 유지, 반복 띄우려면 제거
        if (localStorage.getItem(SEEN_KEY)) return;
        localStorage.setItem(SEEN_KEY, "1");

        overlay.classList.remove("hidden");
    }

    function closeInstallHelp() {
        overlay.classList.add("hidden");
    }

    installOk.addEventListener("click", closeInstallHelp);
    installClose.addEventListener("click", closeInstallHelp);

    // Android/Chrome 계열: beforeinstallprompt 잡아서 "설치하기" 버튼 제공
    window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;

        installBtn.classList.remove("hidden");
        installDesc.textContent = "‘설치하기’를 누르면 홈화면에 앱으로 추가할 수 있어요.";

        // 홈 진입 시 자동으로 안내 팝업
        openInstallHelp();
    });

    installBtn.addEventListener("click", async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        closeInstallHelp();
    });

    // iOS Safari: 자동 설치 프롬프트가 없어서 안내 문구만
    window.addEventListener("load", () => {
        if (isStandalone()) return;

        if (isIOS()) {
        installBtn.classList.add("hidden");
        installDesc.textContent = "Safari에서 공유 버튼(□↑) → ‘홈 화면에 추가’를 눌러 설치할 수 있어요.";
        openInstallHelp();
        }
    });

    // 설치 완료되면 안내 닫기
    window.addEventListener("appinstalled", () => {
        closeInstallHelp();
    });
    </script>
