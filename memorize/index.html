<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>주평강교회웹앱 · 52주 암송</title>

  <!-- Icon -->
  <link href="/favicon.ico" rel="shortcut icon" type="image/x-icon" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script>
    // ✅ /memorize (슬래시 없음)으로 접속하면 상대경로 꼬일 수 있어 보정
    (function () {
      if (location.pathname === "/memorize") location.replace("/memorize/");
    })();
  </script>
</head>

<body class="bg-gray-100">
  <!-- ✅ 하단 고정 nav 공간 확보 -->
  <div class="max-w-md mx-auto p-4 pb-24 space-y-4">
    <!-- Header -->
    <header class="pt-2 flex items-start justify-between">
      <button id="go-home" class="text-sm px-2 py-1 rounded-lg bg-white shadow">🏠 홈</button>

      <div class="text-center flex-1">
        <h1 class="text-xl font-extrabold">주평강교회</h1>
        <p class="text-sm text-gray-500">52주 암송</p>
      </div>

      <button id="share-btn" class="text-sm px-2 py-1 rounded-lg bg-white shadow">🔗 공유</button>
    </header>

    <!-- Week Badge (상단 '📌 이번 주' 버튼 삭제) -->
    <div class="flex items-center justify-between gap-2">
      <div class="text-sm text-gray-500" id="week-badge"></div>
    </div>

    <!-- Options (bible-read와 동일 UI) -->
    <section class="bg-white rounded-2xl shadow p-4">
      <div class="flex items-center justify-between gap-3">
        <div>
          <div class="text-sm font-semibold text-gray-900">자동 다음 분량</div>
          <div class="text-xs text-gray-500">이번 주 완료했다면 다음 미완료 주로 자동 이동</div>
        </div>

        <label class="relative inline-flex items-center cursor-pointer select-none">
          <input id="auto-next-toggle" type="checkbox" class="sr-only peer">
          <div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:bg-blue-600 transition"></div>
          <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition peer-checked:translate-x-5"></div>
        </label>
      </div>
    </section>

    <!-- Main Card -->
    <section id="main-card"></section>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-400 pt-2">
      <span id="progress"></span>
    </footer>
  </div>

  <!-- Bottom Nav (3버튼 통일) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur border-t border-gray-200">
    <div class="mx-auto max-w-md px-4 py-3 grid grid-cols-3 gap-2">
      <button id="prev-btn" class="rounded-xl border border-gray-200 py-3 font-semibold">←</button>
      <button id="go-current" class="rounded-xl bg-blue-600 text-white py-3 font-semibold">이번 주</button>
      <button id="next-btn" class="rounded-xl border border-gray-200 py-3 font-semibold">→</button>
    </div>
  </nav>

  <script src="./app.js"></script>
</body>
</html>
