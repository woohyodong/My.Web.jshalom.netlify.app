<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>주평강교회웹앱 · 365일 통독</title>

  <link href="/favicon.ico" rel="shortcut icon" type="image/x-icon" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">  

  <base href="/bible-read/">

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script>
    (function () {
      if (location.pathname === "/bible-read") location.replace("/bible-read/");
    })();
    window.__BIBLE_READ_BASE__ = "/bible-read/";
  </script>
</head>

<body class="bg-gray-100">
  <div class="max-w-md mx-auto p-4 pb-24 space-y-4">
    <header class="pt-2 flex items-start justify-between">
      <button id="go-home" class="text-sm px-2 py-1 rounded-lg bg-white shadow">🏠 홈</button>

      <div class="text-center flex-1">
        <h1 class="text-xl font-extrabold">주평강교회</h1>
        <p class="text-sm text-gray-500">365일 통독</p>
      </div>

      <button id="share-btn" class="text-sm px-2 py-1 rounded-lg bg-white shadow">🔗 공유</button>
    </header>

    <section class="bg-white rounded-2xl shadow p-4">
      <div class="flex items-center justify-between">
        <div>
          <div class="font-extrabold text-gray-900">옵션</div>
          <div class="text-xs text-gray-500 mt-1">완료 후 자동으로 다음 분량 선택</div>
        </div>

        <label class="relative inline-flex items-center cursor-pointer select-none">
          <input id="opt-auto-next" type="checkbox" class="sr-only peer">
          <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:bg-blue-600"></div>
          <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition peer-checked:translate-x-5"></div>
        </label>
      </div>
    </section>

    <section id="main-card"></section>

    <section class="bg-blue-50 border border-blue-100 rounded-2xl p-4">
      <p class="text-sm text-blue-900 leading-relaxed">
        성경읽기표를 따라 읽으시면
        <span class="font-semibold">구약은 1독</span>,
        <span class="font-semibold">신약과 시편은 2독</span>을 할 수 있습니다.
      </p>
    </section>
  </div>

  <!-- Bible Modal -->
  <div id="bible-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/40" data-bible-close></div>

    <div class="absolute inset-x-0 bottom-0 mx-auto max-w-md p-4">
      <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden max-h-[82vh] flex flex-col">
        <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
          <div>
            <div id="bible-modal-title" class="text-sm font-extrabold text-gray-900">성경</div>
            <div id="bible-modal-subtitle" class="text-xs text-gray-500 mt-0.5">내용</div>
          </div>
          <button type="button" class="px-3 py-2 rounded-xl bg-gray-100 text-gray-700 font-semibold" data-bible-close>닫기</button>
        </div>

        <div id="bible-modal-body" class="px-4 py-4 overflow-auto text-[15px] leading-relaxed text-gray-900">
          <div class="text-sm text-gray-500">불러오는 중…</div>
        </div>

        <!-- ✅ 성경듣기(TTS) 패널 -->
        <div class="px-4 py-3 border-t border-gray-100">
          <button id="bible-tts-toggle"
            class="w-full flex items-center justify-between gap-3 rounded-xl border border-gray-200 px-4 py-3 active:scale-[0.99]">
            <div class="flex items-center gap-2">
              <span class="text-base">🎧</span>
              <span class="font-semibold text-gray-900">성경듣기</span>
              <span id="bible-tts-mini-status" class="text-xs text-gray-500"></span>
            </div>
            <span id="bible-tts-toggle-icon" class="text-sm text-gray-500">▼</span>
          </button>

          <div id="bible-tts-panel" class="hidden mt-3">
            <div class="text-xs text-gray-500 mb-2">
              현재 열려있는 장(본문)을 자연스럽게 읽어줘요
            </div>

            <div class="mt-2">
              <div class="text-xs text-gray-500 mb-1">속도</div>
              <div class="grid grid-cols-3 gap-2">
                <button data-rate="slow" class="bible-rate-btn rounded-xl border border-gray-200 py-2 text-sm font-semibold">조금 느림</button>
                <button data-rate="normal" class="bible-rate-btn rounded-xl border border-gray-200 py-2 text-sm font-semibold">보통</button>
                <button data-rate="fast" class="bible-rate-btn rounded-xl border border-gray-200 py-2 text-sm font-semibold">조금 빠름</button>
              </div>
            </div>

            <div class="mt-3">
              <div class="text-xs text-gray-500 mb-1">음성</div>
              <select id="bible-tts-voice" class="w-full rounded-xl border border-gray-200 px-3 py-2 text-sm">
                <option value="">자동(가능하면 Google)</option>
              </select>
              <div class="mt-1 text-[11px] text-gray-400">
                * 기기/OS에 따라 Google 음성이 없을 수 있어요(iPhone 등)
              </div>
            </div>

            <div class="mt-3 grid grid-cols-2 gap-2">
              <button id="bible-tts-play" class="rounded-xl bg-blue-600 text-white py-3 font-semibold shadow-sm active:scale-[0.99]">
                ▶️ 성경듣기 시작
              </button>
              <button id="bible-tts-stop" class="rounded-xl border border-gray-200 py-3 font-semibold active:scale-[0.99]">
                ⏹ 정지
              </button>
            </div>

            <div id="bible-tts-panel-status" class="mt-2 text-xs text-gray-500"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur border-t border-gray-200">
    <div class="mx-auto max-w-md px-4 py-3 grid grid-cols-3 gap-2">
      <button id="prev-btn" class="rounded-xl border border-gray-200 py-3 font-semibold">←</button>
      <button id="today-btn" class="rounded-xl bg-blue-600 text-white py-3 font-semibold shadow-sm active:scale-[0.99]">오늘</button>
      <button id="next-btn" class="rounded-xl border border-gray-200 py-3 font-semibold">→</button>
    </div>
  </nav>

  <script src="./app.js"></script>
</body>
</html>
