<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>주평강교회앱 · 365일 통독</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body class="bg-gray-100">
  <div class="max-w-md mx-auto p-4 pb-24 space-y-4">
    <!-- Header -->
    <header class="pt-2 flex items-center justify-between">
      <button id="go-home" class="text-sm px-2 py-1 rounded-lg bg-white shadow">🏠 홈</button>

      <div class="text-center flex-1">
        <h1 class="text-xl font-extrabold">주평강교회</h1>
        <p class="text-sm text-gray-500">365일 통독</p>
      </div>

      <button id="share-btn" class="text-sm px-2 py-1 rounded-lg bg-white shadow">🔗 공유</button>
    </header>

    <!-- Top Row -->
    <div class="flex items-center justify-between gap-2">
      <div class="text-sm text-gray-500" id="day-badge"></div>

      <button id="go-today" class="text-sm px-3 py-1 rounded-full bg-white shadow hover:shadow-md active:scale-[0.98]">
        📌 오늘 분량
      </button>
    </div>

    <!-- Cycle + progress -->
    <div class="bg-white rounded-2xl shadow p-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-sm text-gray-500">회차</span>
        <select id="cycle-select" class="rounded-xl border border-gray-200 bg-white px-3 py-2 text-sm font-semibold"></select>
      </div>
      <div class="text-sm text-gray-600">
        <span id="progress-count" class="font-semibold text-gray-900">0</span>
        <span id="progress-total"> / 365 완료</span>
      </div>
    </div>

    <!-- Main Card -->
    <section id="main-card"></section>

    <footer class="text-center text-xs text-gray-400 pt-2">
      <span>진도는 기기별(localStorage) 저장 · 링크 공유는 앱만 공유돼요</span>
    </footer>
  </div>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur border-t border-gray-200">
    <div class="mx-auto max-w-md px-4 py-3 grid grid-cols-3 gap-2">
      <button id="prev-btn" class="rounded-xl border border-gray-200 py-3 font-semibold">←</button>
      <button id="today-btn" class="rounded-xl bg-blue-600 text-white py-3 font-semibold">오늘</button>
      <button id="next-btn" class="rounded-xl border border-gray-200 py-3 font-semibold">→</button>
    </div>
  </nav>

  <script src="./app.js"></script>
</body>
</html>
